name: radar-concurso

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar
  volumes:
    - ./backend:/app        # código ao vivo em desenvolvimento

x-depois-das-migrations: &depois-das-migrations
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      retries: 10

  # Roda uma vez a cada `up` e termina; os demais serviços só sobem depois dele.
  migrate:
    <<: *backend
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: [*backend, *depois-das-migrations]
    command: python -m radar.worker loop
    restart: unless-stopped

  bot:
    <<: [*backend, *depois-das-migrations]
    command: python -m radar.bot.main
    restart: on-failure

  api:
    <<: [*backend, *depois-das-migrations]
    command: uvicorn radar.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
