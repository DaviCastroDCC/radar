# Produção em uma única VM: docker compose -f docker-compose.prod.yml up -d --build
# Guia completo: deploy/README.md
name: radar-concurso

x-app: &app
  build:
    context: ./backend
  image: radar-concurso:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/radar
    LOG_FORMAT: json
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"   # sem isto, logs enchem o disco da VM em semanas
      max-file: "5"

x-depois-das-migrations: &depois-das-migrations
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem "ports": o banco só é acessível pela rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    logging: *logging

  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: [*app, *depois-das-migrations]
    command: python -m radar.worker loop

  bot:
    <<: [*app, *depois-das-migrations]
    command: python -m radar.bot.main

  api:
    <<: [*app, *depois-das-migrations]
    command: >-
      uvicorn radar.api.main:app --host 0.0.0.0 --port 8000 --workers 2
      --proxy-headers --forwarded-allow-ips=* --no-server-header
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2.8-alpine
    environment:
      DOMINIO: "${DOMINIO:?defina DOMINIO no .env, por exemplo api.radarconcurso.com.br}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificados: perder isto = novo pedido ao Let's Encrypt
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  backup:
    image: pgvector/pgvector:pg17
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: radar
      PGDATABASE: radar
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      INTERVALO_HORAS: ${BACKUP_INTERVALO_HORAS:-24}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
